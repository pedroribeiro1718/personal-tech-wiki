name: qwen36-a3b
services:
  qwen-a3b:
    image: local/qwen-ninfer:a140e7ae82a1
    container_name: qwen36-a3b
    restart: "no"
    stop_grace_period: 60s
    ipc: host
    gpus: all
    security_opt: [label=disable]
    ports: ["127.0.0.1:30000:8080"]
    volumes:
      - type: bind
        source: ${QWEN_MODEL_FILE:?Run local-ai prepare a3b first}
        target: /models/qwen3_6_35b_a3b.ninfer
        read_only: true
    command:
      - ninfer-serve
      - /models/qwen3_6_35b_a3b.ninfer
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model-id
      - qwen3.6-35b-a3b-ninfer-groupwise-int-262144
      - --max-context
      - ${QWEN_CONTEXT_LENGTH:-262144}
      - --kv-capacity
      - ${QWEN_KV_CAPACITY:-262144}
      - --max-concurrency
      - "1"
      - --prefill-chunk
      - "1024"
      - --kv-dtype
      - int8
      - --device-state-slots
      - "1"
      - --host-state-slots
      - "4"
      - --host-kv-mib
      - "4096"
      - --spec
      - mtp
      - --draft-tokens
      - "3"
      - --lm-head-draft
      - --preserve-thinking
      # Qwen3.6-35B-A3B precise-coding profile. Harness rc.2 cannot send the
      # complete sampler tuple, so pin it at NInfer's supported server seam.
      - --temperature
      - "0.6"
      - --top-p
      - "0.95"
      - --top-k
      - "20"
      - --min-p
      - "0.0"
      - --presence-penalty
      - "0.0"
      - --frequency-penalty
      - "0.0"
      - --vision
