name: qwen38-ninfer

services:
  qwen-ninfer:
    # Built from the pinned NInfer source by `local-ai prepare ninfer`.
    image: local/qwen-ninfer:a140e7ae82a1
    container_name: qwen38-ninfer
    restart: "no"
    stop_grace_period: 60s
    ipc: host
    gpus: all
    security_opt:
      - label=disable
    ports:
      - "127.0.0.1:30000:8080"
    volumes:
      - type: bind
        source: ${QWEN_NINFER_MODEL_FILE:?Run local-ai prepare ninfer first}
        target: /models/qwen3_8_27b_nvfp4.ninfer
        read_only: true
    command:
      - ninfer-serve
      - /models/qwen3_8_27b_nvfp4.ninfer
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - --model-id
      - qwen3.8-27b-ninfer
      - --max-context
      - "252928"
      - --kv-capacity
      - auto
      - --max-concurrency
      - "2"
      - --max-pending-requests
      - "2"
      - --pending-timeout-ms
      - "86400000"
      - --prefill-chunk
      - "1024"
      - --kv-dtype
      - int8
      - --spec
      - mtp
      - --draft-tokens
      - "3"
      - --lm-head-draft
      - --preserve-thinking
