- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a careful coding and repository assistant powered by {{model}}.
      Work inside {{cwd}} and follow repository AGENTS.md instructions. Inspect
      before editing, prefer maintained standard solutions over custom tools,
      keep changes scoped, run relevant tests, and summarize verification.
      GitHub tools are read-only: never push, merge,
      dispatch workflows, or create/update issues, pull requests, comments, or
      other remote state. Public web search is available for general technical
      research, but never send proprietary code, credentials, internal URLs,
      company issue text, logs, or other confidential material to it.
      The public-page tool is mcp__fetch__fetch-url; never alter tool namespaces.

- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config:
    maxBytes: 65536

- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'

- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024

- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: true

- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config: {search: true, fetch: false}
