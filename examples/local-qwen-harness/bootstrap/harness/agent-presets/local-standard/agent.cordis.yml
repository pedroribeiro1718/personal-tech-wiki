- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    text: >-
      You are a coding agent powered by {{model}}. Work in {{cwd}}. Inspect
      before editing and prefer maintained, standardized solutions; search for
      a ready-made solution before writing custom tools or integrations. The
      public-page tool is mcp__fetch__fetch-url; never alter tool namespaces.
      For browser-facing work, use the installed Playwright. Never use npx or
      install Playwright or its browsers. A Harness Bash call does not preserve
      a playwright-cli browser after the call exits, so put open, inspection,
      and close commands in the same Bash call. For multi-step work, prefer one
      small Node script that directly requires playwright. Consult --help
      instead of guessing commands. Validate each recommended locator resolves
      exactly once and safely exercise it without submitting or changing remote
      state unless authorized; do not merely print candidate locators. Never
      claim a screenshot was visually verified through the text read tool.
      Check console errors and report the exact verification. Remove scratch
      scripts, screenshots, and .playwright-cli artifacts unless requested.
- id: agent-instructions
  name: '@deepseek-ai/dsh-agent-instructions'
  config: {maxBytes: 65536}
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'
- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'
- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config: {sampleOverCapGlobResults: false}
- id: tool-jobs
  name: '@deepseek-ai/dsh-tool-jobs'
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'
- id: tool-goal
  name: '@deepseek-ai/dsh-tool-goal'
- id: planning
  name: cordis:group
  group: true
  isolate: {planMode: true}
  config:
    - id: plan-mode
      name: '@deepseek-ai/dsh-plan-mode'
      config:
        section: >-
          Explore and design first. Present the complete plan for approval
          before making changes.
- id: compaction
  name: cordis:group
  group: true
  isolate: {compaction: true, toolResultPruner: true}
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'
    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'
    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config: {thresholdChars: 8192, headChars: 4096, tailChars: 1024}
- id: delegation
  name: cordis:group
  group: true
  isolate: {workflowEngine: true}
  config:
    - id: tool-subagent-control
      name: '@deepseek-ai/dsh-tool-subagent-control'
    - id: tool-subagent-list-agents
      name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
    - id: tool-subagent
      name: '@deepseek-ai/dsh-tool-subagent'
      config: {provider: spawn, toolName: subagent, backgroundMode: continuable}
    - id: tool-subagent-fork
      name: '@deepseek-ai/dsh-tool-subagent'
      config: {provider: fork, toolName: subagent_fork, backgroundMode: continuable}
    - id: workflow-worker-thread
      name: '@deepseek-ai/dsh-workflow-worker-thread'
      config: {provider: spawn}
    - id: tool-workflow
      name: '@deepseek-ai/dsh-tool-workflow'
    - id: tool-ralph
      name: '@deepseek-ai/dsh-tool-ralph'
      config: {subagentProvider: spawn, maxRounds: 64}
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'
- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config: {allowParallelInProgress: true}
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config: {search: true, fetch: false}
