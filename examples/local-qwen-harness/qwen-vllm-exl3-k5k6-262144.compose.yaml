name: qwen38-full

services:
  qwen-full:
    # Gilded Gnosis/vLLM image qualified by the model author on an RTX 5090.
    image: voipmonitor/vllm@sha256:820181fbbc975cd5291c411cda9771d58fecee1636d916f508f47230df20592b
    container_name: qwen38-full
    restart: "no"
    stop_grace_period: 60s
    ipc: host
    gpus: all
    security_opt:
      - label=disable
    ports:
      - "127.0.0.1:30000:8000"
    volumes:
      - qwen38-full-hf-cache:/root/.cache/huggingface:Z
      - type: bind
        source: ${QWEN_FULL_PATCH_DIR:?Run local-ai prepare exl3 first}/tools/vllm-exl3-prefill-dispatch.py
        target: /opt/venv/lib/python3.12/site-packages/vllm/model_executor/layers/quantization/exl3.py
        read_only: true
      - type: bind
        source: ${QWEN_FULL_PATCH_DIR:?Run local-ai prepare exl3 first}/tools/vllm-qwen3_5-embed-quant-config.py
        target: /opt/venv/lib/python3.12/site-packages/vllm/model_executor/models/qwen3_5.py
        read_only: true
      - type: bind
        source: ${QWEN_FULL_PATCH_DIR:?Run local-ai prepare exl3 first}/tools/vllm-qwen3_5_mtp-embed-quant-config.py
        target: /opt/venv/lib/python3.12/site-packages/vllm/model_executor/models/qwen3_5_mtp.py
        read_only: true
      - type: bind
        source: ${QWEN_FULL_PATCH_DIR:?Run local-ai prepare exl3 first}/tools/vllm-mamba-align-scheduler.py
        target: /opt/venv/lib/python3.12/site-packages/vllm/v1/core/sched/scheduler.py
        read_only: true
    environment:
      HF_HUB_DISABLE_TELEMETRY: "1"
      VLLM_NO_USAGE_STATS: "1"
      DO_NOT_TRACK: "1"
      VLLM_EXL3_EMBED_BITS: "8"
      VLLM_EXL3_GRAPH_DECODE: "1"
      VLLM_EXL3_PREFILL_RECONSTRUCT_M: "128"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    entrypoint:
      - /opt/venv/bin/vllm
    command:
      - serve
      - malaiwah/Qwen3.8-27B-EXL3-K5K6-context
      - --revision
      - 6362d06d351de1e3e4356a9e104682c423f23651
      - --served-model-name
      - qwen3.8-27b-vllm-exl3-k5k6-262144
      - --quantization
      - exl3
      - --quantization-config
      - '{"linear":{"weight":"mxfp8"},"ignore":["re:.*visual\\..*","re:.*in_proj_a$","re:.*in_proj_b$","re:.*in_proj_ba$","re:.*mtp\\..*","lm_head"]}'
      - --max-model-len
      - "${QWEN_CONTEXT_LENGTH:-262144}"
      - --gpu-memory-utilization
      - "${QWEN_GPU_MEMORY_UTILIZATION:-0.955}"
      - --max-num-seqs
      - "1"
      - --kv-cache-dtype
      - fp8
      - --max-num-batched-tokens
      - "${QWEN_PREFILL_CHUNK:-2048}"
      - --generation-config
      - auto
      - --speculative-config
      - '{"method":"mtp","num_speculative_tokens":3}'
      - --mm-processor-kwargs
      - '{"truncation":false,"max_pixels":${QWEN_MAX_PIXELS:-8388608}}'
      - --compilation-config
      - '{"cudagraph_mode":"FULL_DECODE_ONLY","cudagraph_capture_sizes":[4]}'
      - --reasoning-parser
      - qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser
      - qwen3_coder
      - --host
      - 0.0.0.0
      - --port
      - "8000"

volumes:
  qwen38-full-hf-cache:
    name: qwen38-full-hf-cache
